# Shared configuration for llama-build / llama-router / llama-model.
# Sourced as shell. All values optional — defaults shown.

# Where the llama.cpp git checkout lives (used by llama-build)
LLAMA_SRC_DIR="$HOME/Desktop/src/LLAMA-cpp/llama.cpp"

# Install prefix for binaries
#LLAMA_PREFIX="$HOME/.local"

# Router server settings
#LLAMA_HOST=127.0.0.1
#LLAMA_PORT=8080

# Where GGUF models are stored
#LLAMA_MODELS_DIR="$HOME/.local/share/llama/models"

# Preset INI for router mode
#LLAMA_PRESET_FILE="$HOME/.config/llama/models.ini"

# Max models loaded simultaneously (24 GB M4: keep this low)
#LLAMA_MODELS_MAX=2

# Extra arguments appended to llama-server (applied to every model instance)
#LLAMA_EXTRA_ARGS="--no-webui"
