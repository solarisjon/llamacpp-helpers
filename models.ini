; llama.cpp router-mode model presets
; Docs: llama.cpp/tools/server/README.md ("Model presets")
;
; Each [section] is a preset. Keys are llama-server arguments without leading
; dashes (long form, short form, or LLAMA_ARG_* env names all work).
; If a section name matches a model the router already knows (from the models
; dir or HF cache), it becomes that model's default config. Otherwise the
; section must set `model = /abs/path.gguf` or an HF repo.

version = 1

; Global defaults applied to every model (overridable per preset).
[*]
; context size
c = 8192
; offload everything to Metal
n-gpu-layers = 999
; enable jinja chat templates (needed for tool calling on modern models)
jinja = true
; keep an unused model instance alive; router unloads LRU when models-max is hit

; --- Examples (uncomment / adapt) ---------------------------------------

; A model file that lives in the models dir: section name = file name without .gguf
;[Qwen3-8B-Q4_K_M]
;c = 16384
;temp = 0.7

; A named preset pointing at an explicit file:
;[coder]
;model = /Users/solarisjon/.local/share/llama/models/Qwen2.5-Coder-14B-Instruct-Q4_K_M.gguf
;c = 32768
;load-on-startup = true

; A Hugging Face cached model (add with: llama-server -hf ggml-org/gemma-3-4b-it-GGUF)
;[ggml-org/gemma-3-4b-it-GGUF:Q4_K_M]
;c = 8192
